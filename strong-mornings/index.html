<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow">
<title>Strong Mornings — home strength & mobility</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strong Mornings">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f6f7f5;--card:#ffffff;--ink:#1c2321;--muted:#5d6b66;--line:#e3e7e4;
  --acc:#0f766e;--acc2:#e6f4f1;--warn:#b45309;--warn2:#fef3c7;--bad:#b91c1c;--bad2:#fee2e2;--good:#15803d;
  --fig:#1f4f4a;--fig2:#8fb3ad;--floor:#d9dfdb;--prop:#b7a98f;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1413;--card:#171e1c;--ink:#e7ecea;--muted:#9aa8a3;--line:#26302d;
  --acc:#2dd4bf;--acc2:#12302c;--warn:#fbbf24;--warn2:#3a2c0b;--bad:#f87171;--bad2:#3b1414;--good:#4ade80;
  --fig:#cfe9e4;--fig2:#4f716b;--floor:#2a3532;--prop:#7d6f58;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800}
.htitle{font-weight:750;font-size:17px;line-height:1.1}
.hsub{font-size:12px;color:var(--muted)}
.gear{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px}
main{max-width:760px;margin:0 auto;padding:14px 16px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:650}
h1{font-size:22px;margin:4px 0 8px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:15.5px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--acc2);color:var(--acc);margin:2px 4px 2px 0;font-weight:600}
.chip.s{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.st{background:var(--warn2);color:var(--warn)}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:650}
@media (prefers-color-scheme:dark){.btn{color:#062b27}}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.tl{position:relative;margin:6px 0 0}
.tli{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tli:last-child{border-bottom:0}
.tm{font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);font-size:14px;padding-top:1px}
.tt{font-weight:650}
.done .tt{text-decoration:line-through;opacity:.6}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--acc);display:inline-grid;place-items:center;background:transparent;flex:none;font-size:14px;color:#fff;padding:0}
.ck.on{background:var(--acc)}
.banner{border-radius:var(--r);padding:12px 14px;margin:10px 0;font-size:14px}
.banner.warn{background:var(--warn2);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.bad{background:var(--bad2);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.banner.ok{background:var(--acc2);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:4px}
.excard .nm{font-weight:650;font-size:14px;line-height:1.25}
.excard .mu{font-size:12px;color:var(--muted);line-height:1.3}
.fig{width:100%;aspect-ratio:4/3;background:linear-gradient(var(--bg),var(--card));border-radius:10px;overflow:hidden}
.fig svg{width:100%;height:100%;display:block}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:13px}
.filters button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){.filters button.on{color:#062b27}}
.toggle{display:flex;align-items:center;gap:10px;justify-content:space-between}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--warn)}
.sw.on::after{left:21px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.exrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.exrow:last-child{border-bottom:0}
.exrow .mini{width:74px;flex:none}
.exrow .dz{font-size:13px;color:var(--muted)}
.dose{font-weight:700;color:var(--acc)}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.weeks button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;padding:6px 8px;font-size:13px}
.weeks button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.weeks button.cur{outline:2px solid var(--warn);outline-offset:1px}
@media (prefers-color-scheme:dark){.weeks button.on{color:#062b27}}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:650}
ol,ul{padding-left:20px;margin:6px 0}
li{margin:3px 0}
input[type=date],input[type=time],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px;margin:0 auto}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--line);font-size:10px;display:grid;place-items:center;color:var(--muted)}
.heat .l1{background:color-mix(in srgb,var(--acc) 35%,var(--line))}
.heat .l2{background:var(--acc);color:#fff}
.heat .fut{opacity:.35}
.heat .td{outline:2px solid var(--warn)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .card{margin:0;text-align:center}
.stat b{display:block;font-size:24px;color:var(--acc)}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.ov .in{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.ovtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.x{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc)}
.bigfig{max-width:520px;margin:0 auto}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sets button{width:40px;height:40px;border-radius:12px;border:2px solid var(--acc);background:transparent;font-weight:700;color:var(--acc)}
.sets button.on{background:var(--acc);color:#fff}
.timer{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.tlabel{text-align:center;font-weight:700;color:var(--warn);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--muted)}
.light{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;margin:6px 0}
.dot{width:18px;height:18px;border-radius:50%;margin-top:3px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">S</div>
  <div><div class="htitle">Strong Mornings</div><div class="hsub" id="hsub"></div></div>
  <button class="gear" data-act="settings" aria-label="Settings">⚙︎ Settings</button>
</div></header>
<main id="view"></main>
<nav class="tabs"><div class="in">
  <button data-tab="today"><span class="i">☀︎</span>Today</button>
  <button data-tab="plan"><span class="i">▦</span>Plan</button>
  <button data-tab="lib"><span class="i">⚘</span>Exercises</button>
  <button data-tab="prog"><span class="i">↗</span>Progress</button>
  <button data-tab="guide"><span class="i">✚</span>Guide</button>
</div></nav>
<div id="ov" class="ov" hidden></div>

<script>
"use strict";
/* ============================================================
   1. FIGURE ENGINE — animated stick-figure demonstrations
   World coords: ground is y=0, up is negative. Figure faces +x.
   ============================================================ */
const NS='http://www.w3.org/2000/svg';
const LEN={t:42,n:14,hr:7.5,ua:25,fa:21,th:34,sh:33,ft:9};
const D2R=Math.PI/180;
const pt=(p,a,l)=>[p[0]+Math.cos(a*D2R)*l,p[1]+Math.sin(a*D2R)*l];
function ik(b,t,l1,l2,s){
  const dx=t[0]-b[0],dy=t[1]-b[1];const D=Math.hypot(dx,dy)||0.001;
  const ux=dx/D,uy=dy/D;
  const d=Math.max(Math.min(D,l1+l2-0.001),Math.abs(l1-l2)+0.001);
  const a=(l1*l1-l2*l2+d*d)/(2*d);const hh=Math.sqrt(Math.max(0,l1*l1-a*a));
  const j=[b[0]+ux*a-uy*hh*s,b[1]+uy*a+ux*hh*s];
  const ang=Math.atan2(t[1]-j[1],t[0]-j[0])/D2R;
  return [j,pt(j,ang,l2),ang];
}
function solve(p,front){
  const hip=p.hip,t=p.t,fw=t+90;
  const sho=pt(hip,t,LEN.t);
  const mid=pt([(hip[0]+sho[0])/2,(hip[1]+sho[1])/2],fw,p.curve||0);
  let head=pt(sho,p.h??t,LEN.n);if(p.chin)head=pt(head,fw,p.chin);
  const so=front?11:0,ho=front?6:0;
  const S=[pt(sho,fw,so),pt(sho,fw,-so)],Hh=[pt(hip,fw,ho),pt(hip,fw,-ho)];
  const limb=(base,ang,tgt,l1,l2,s)=>{
    if(tgt)return ik(base,tgt,l1,l2,s);
    const j=pt(base,ang[0],l1);return [j,pt(j,ang[1],l2),ang[1]];
  };
  const arms=[0,1].map(i=>limb(S[i],p['a'+(i+1)],p['H'+(i+1)],LEN.ua,LEN.fa,(p.eb?p.eb[i]:1)));
  const legs=[0,1].map(i=>limb(Hh[i],p['l'+(i+1)],p['F'+(i+1)],LEN.th,LEN.sh,(p.kb?p.kb[i]:-1)));
  const feet=legs.map((l,i)=>{
    const fa=p['ft'+(i+1)]??(front?(i?180:0):l[2]-90);
    return pt(l[1],fa,front?5:LEN.ft);
  });
  return {hip,sho,mid,head,S,Hh,arms,legs,feet,h:p.h??t};
}
function lerpV(a,b,u){
  if(a===undefined)return b;if(b===undefined)return a;
  if(typeof a==='number')return a+(b-a)*u;
  if(Array.isArray(a))return a.map((v,i)=>lerpV(v,b[i],u));
  return u<.5?a:b;
}
function lerpPose(a,b,u){const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>o[k]=lerpV(a[k],b[k],u));return o}
const ease=u=>.5-.5*Math.cos(Math.PI*u);

const FIGS=new Set();
function propBounds(pr){
  switch(pr[0]){
    case 'stool':return [[pr[1]-pr[3]/2,pr[2]],[pr[1]+pr[3]/2,0]];
    case 'chair':return [[pr[1]-pr[3]/2,pr[2]-pr[4]],[pr[1]+pr[3]/2,0]];
    case 'wall':return [[pr[1]-4,-128],[pr[1]+6,0]];
    case 'post':return [[pr[1]-4,-140],[pr[1]+4,0]];
    case 'table':return [[pr[1],pr[2]],[pr[3],0]];
  }return [];
}
function drawProp(g,pr){
  const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);e.setAttribute('class','prop');g.appendChild(e);return e};
  const [type]=pr;
  if(type==='stool'||type==='chair'){
    const [,x,top,w,back]=pr;
    mk('rect',{x:x-w/2,y:top,width:w,height:4,rx:1.5});
    mk('line',{x1:x-w/2+3,y1:top+3,x2:x-w/2+3,y2:0,'stroke-width':3});
    mk('line',{x1:x+w/2-3,y1:top+3,x2:x+w/2-3,y2:0,'stroke-width':3});
    if(type==='chair')mk('line',{x1:x-w/2+1.5,y1:top,x2:x-w/2-2,y2:top-back,'stroke-width':4});
  }else if(type==='wall'){
    mk('rect',{x:pr[1],y:-128,width:6,height:128});
  }else if(type==='post'){
    mk('rect',{x:pr[1]-3,y:-140,width:6,height:140,rx:1});
  }else if(type==='table'){
    const [,x1,top,x2]=pr;
    mk('rect',{x:x1,y:top,width:x2-x1,height:4,rx:1.5});
    mk('line',{x1:x1+3,y1:top+3,x2:x1+3,y2:0,'stroke-width':3});
    mk('line',{x1:x2-3,y1:top+3,x2:x2-3,y2:0,'stroke-width':3});
  }
}
function mountFig(el){
  const id=el.dataset.ex;const A=ANIM[EX[id]?.anim||id];if(!A||el.firstChild)return;
  const front=A.view==='front';
  const xs=[],ys=[];
  const add=s=>{
    const pts=[s.hip,s.sho,...s.S,...s.Hh,...s.feet];
    s.arms.forEach(a=>pts.push(a[0],a[1]));s.legs.forEach(l=>pts.push(l[0],l[1]));
    pts.forEach(p=>{xs.push(p[0]);ys.push(p[1])});
    xs.push(s.head[0]-LEN.hr,s.head[0]+LEN.hr);ys.push(s.head[1]-LEN.hr);
  };
  A.kf.forEach((k,i)=>{const nx=A.kf[(i+1)%A.kf.length];for(let u=0;u<=1.001;u+=.25)add(solve(lerpPose(k[0],nx[0],u),front))});
  (A.props||[]).forEach(pr=>propBounds(pr).forEach(p=>{xs.push(p[0]);ys.push(p[1])}));
  let minX=Math.min(...xs)-12,maxX=Math.max(...xs)+12,minY=Math.min(...ys)-16,maxY=9;
  let w=maxX-minX,hg=maxY-minY;const ar=4/3;
  if(w/hg<ar){const nw=hg*ar;minX-=(nw-w)/2;w=nw}else{const nh=w/ar;minY-=(nh-hg);hg=nh}
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`${minX.toFixed(1)} ${minY.toFixed(1)} ${w.toFixed(1)} ${hg.toFixed(1)}`);
  svg.setAttribute('role','img');svg.setAttribute('aria-label',(EX[id]?.name||id)+' demonstration');
  svg.innerHTML=`<style>
   .prop{fill:var(--prop);stroke:var(--prop);stroke-linecap:round}
   .lb{fill:none;stroke-linecap:round;stroke-linejoin:round}
   .near{stroke:var(--fig);stroke-width:6}.far{stroke:var(--${front?'fig':'fig2'});stroke-width:6}
   .tor{stroke:var(--fig);stroke-width:${front?7:9}}
   .hd{fill:var(--fig)}.nose{fill:var(--fig)}
  </style>`;
  const gp=document.createElementNS(NS,'g');svg.appendChild(gp);
  const fl=document.createElementNS(NS,'rect');
  fl.setAttribute('x',minX);fl.setAttribute('y',0.5);fl.setAttribute('width',w);fl.setAttribute('height',maxY);fl.setAttribute('fill','var(--floor)');
  gp.appendChild(fl);
  (A.props||[]).forEach(pr=>drawProp(gp,pr));
  const P=(cls)=>{const e=document.createElementNS(NS,'path');e.setAttribute('class','lb '+cls);svg.appendChild(e);return e};
  const farArm=P('far'),farLeg=P('far'),tor=P('tor'),neck=P('tor');
  const head=document.createElementNS(NS,'circle');head.setAttribute('r',LEN.hr);head.setAttribute('class','hd');svg.appendChild(head);
  const nose=document.createElementNS(NS,'circle');nose.setAttribute('r',2.2);nose.setAttribute('class','nose');if(!front)svg.appendChild(nose);
  const nearLeg=P('near'),nearArm=P('near');
  if(front){tor.style.fill='var(--fig)';}
  const f=(p)=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  const total=A.kf.reduce((s,k)=>s+k[1]+k[2],0);
  const t0=performance.now()-(A.offset||0);
  const fig={svg,update(now){
    let loc=(now-t0)%total,pose=A.kf[0][0];
    for(let i=0;i<A.kf.length;i++){
      const [p,hold,move]=A.kf[i];
      if(loc<hold){pose=p;break}loc-=hold;
      if(loc<move){pose=lerpPose(p,A.kf[(i+1)%A.kf.length][0],ease(loc/move));break}loc-=move;
    }
    const s=solve(pose,front);
    const arm=i=>`M${f(s.S[i])}L${f(s.arms[i][0])}L${f(s.arms[i][1])}`;
    const leg=i=>`M${f(s.Hh[i])}L${f(s.legs[i][0])}L${f(s.legs[i][1])}L${f(s.feet[i])}`;
    farArm.setAttribute('d',arm(1));farLeg.setAttribute('d',leg(1));
    nearArm.setAttribute('d',arm(0));nearLeg.setAttribute('d',leg(0));
    if(front){tor.setAttribute('d',`M${f(s.S[0])}L${f(s.S[1])}L${f(s.Hh[1])}L${f(s.Hh[0])}Z`)}
    else{const c=[2*s.mid[0]-(s.hip[0]+s.sho[0])/2,2*s.mid[1]-(s.hip[1]+s.sho[1])/2];tor.setAttribute('d',`M${f(s.hip)}Q${f(c)} ${f(s.sho)}`)}
    neck.setAttribute('d',`M${f(s.sho)}L${f(s.head)}`);
    head.setAttribute('cx',s.head[0]);head.setAttribute('cy',s.head[1]);
    const n=pt(s.head,s.h+90,6.5);nose.setAttribute('cx',n[0]);nose.setAttribute('cy',n[1]);
  }};
  el.appendChild(svg);fig.update(performance.now());FIGS.add(fig);
}
function mountFigs(root){root.querySelectorAll('.fig[data-ex]').forEach(mountFig)}
(function loop(now){for(const f of FIGS){if(!f.svg.isConnected){FIGS.delete(f);continue}f.update(now)}requestAnimationFrame(loop)})(performance.now());

/* ---------- Base poses ---------- */
const P={
  stand:{hip:[0,-66],t:-90,h:-90,a1:[93,96],a2:[87,90],F1:[3,-3],F2:[-2,-3]},
  seat:{hip:[0,-38],t:-88,h:-90,a1:[85,30],a2:[82,28],F1:[30,-3],F2:[27,-3]},
  sup:{hip:[0,-5],t:180,h:194,H1:[4,-4],H2:[1,-4],F1:[42,-3],F2:[40,-3]},

const KEY='strongMornings.v1';
const todayISO=()=>iso(new Date());
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function defaultStart(){const t=new Date();t.setHours(0,0,0,0);const k=t.getDay();if(k===1)return iso(t);const m=mondayOf(t);m.setDate(m.getDate()+7);return iso(m)}
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.start)return s}catch(e){}return {start:defaultStart(),wake:'05:30',flare:{},days:{},ex:{},weights:[],pain:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const day=d=>S.days[d]||(S.days[d]={});

function weekOf(dateStr){ // program week (1-based), may be <=0 before start
  const st=mondayOf(parseISO(S.start)),d=parseISO(dateStr);
  return Math.floor((mondayOf(d)-st)/(7*864e5))+1;
}
function phaseFor(w){if(w<=4)return PHASES[0];if(w<=8)return PHASES[1];return PHASES[2]}
const wv=(v,i)=>Array.isArray(v)?v[Math.min(i,v.length-1)]:v;
function resolveItems(items,week){
  const ph=phaseFor(week);const i=Math.max(0,Math.min(3,(week-1)-(ph.weeks[0]-1)));
  return items.map(it=>Object.assign({},it,{sets:wv(it.sets,i),hold:wv(it.hold,i)}));
}
function dayPlan(dateStr){
  const w=weekOf(dateStr),d=parseISO(dateStr).getDay();
  const ww=Math.max(1,Math.min(w,12)),ph=phaseFor(ww);
  let strength=null;
  if([1,3,5].includes(d)){
    if(ph.n===1)strength='F';
    else{const odd=ww%2===1;const idx=[1,3,5].indexOf(d);strength=(odd?['A','B','A']:['B','A','B'])[idx]}
  }
  const type=strength?'strength':d===0?'rest':'active';
  return {week:w,pw:ww,ph,dow:d,type,strength,sat:d===6};
}
function strengthSession(dateStr){
  const p=dayPlan(dateStr);if(!p.strength)return null;
  const W=p.ph.W[p.strength];
  return {title:W.title,sub:`Phase ${p.ph.n} · Week ${p.pw}`,items:resolveItems(W.items,p.pw),key:'strength',wk:p.strength};
}
function getSession(key,dateStr){
  if(key==='strength')return strengthSession(dateStr);
  const s=SESS[key];return {title:s.title,sub:s.sub,items:s.items.map(x=>Object.assign({},x)),key};
}
function itemSecs(it){
  const sides=it.sides?2:1;
  let per;
  if(it.hold)per=it.hold*sides+(it.sides?5:0);
  else{const m=String(it.reps).match(/\d+/g)||['10'];const n=m.length>1?(+m[0]+ +m[1])/2:+m[0];per=n*(it.sec||4)*(/side/.test(it.reps)?2:1)}
  return it.sets*per+(it.sets-1)*(it.rest||8)+8;
}
const sessMin=s=>Math.round(s.items.reduce((a,it)=>a+itemSecs(it),0)/60);
function doseText(it){
  let t=it.label?it.label:it.hold?`${it.sets} × ${it.hold} s${it.sides?' each side':''}`:`${it.sets} × ${it.reps}`;
  if(it.label&&it.sets>1)t=`${it.sets} × `+t;
  return t;
}
function doseExtra(it){const a=[];if(it.tempo)a.push('tempo '+it.tempo);if(it.note)a.push(it.note);if(it.rest)a.push(`rest ${it.rest} s`);return a.join(' · ')}
function addMin(hm,m){let [h,mi]=hm.split(':').map(Number);let t=(h*60+mi+m+1440)%1440;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
const NEXT={boxSquat:'squat',squat:'pauseSquat',wallPU:'inclinePU',inclinePU:'kneePU',gluteBridge:'slBridge',splitSquat:'reverseLunge'};
function ready(ex){const l=S.ex[ex]||[];return l.length>=2&&l[l.length-1].top&&l[l.length-2].top}

function chart(vals,maxV,label){

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--acc)"/>`).join('')}</svg><div class="small muted">${label} · latest <b>${vals[vals.length-1]}</b></div>`;
}

}
function tboxIdle(){
  const it=PL.items[PL.i];const b=document.getElementById('tbox');if(!b)return;
  const allDone=PL.done[PL.i]>=it.sets;
  if(allDone){b.innerHTML=`<div style="font-weight:700;color:var(--good)">✓ All sets done</div><button class="btn wide" style="margin-top:8px" data-act="next">${PL.i===PL.items.length-1?'Finish':'Next exercise →'}</button>`;return}
  if(it.hold)b.innerHTML=`<button class="btn wide" data-act="hold">▶ Start ${it.hold} s hold${it.sides?' (side 1, then side 2)':''}</button><div class="small muted" style="margin-top:6px">Set ${PL.done[PL.i]+1} of ${it.sets}</div>`;
  else b.innerHTML=`<button class="btn wide" data-act="repdone">✓ Set ${PL.done[PL.i]+1} done${it.rest&&PL.done[PL.i]+1<it.sets?` → rest ${it.rest} s`:''}</button><div class="small muted" style="margin-top:6px">Do ${esc(it.reps)}${it.note?' · '+esc(it.note):''}</div>`;
}
function runSeq(seq,onEnd){
  stopTimer();let k=0,end=0;const b=document.getElementById('tbox');
  const startStep=()=>{if(k>=seq.length){stopTimer();onEnd&&onEnd();return}end=Date.now()+seq[k].sec*1000;beep(k===0?660:880,.15)};
  const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    if(left<=0){k++;if(k>=seq.length){beep(990,.35);vib(300);stopTimer();onEnd&&onEnd();return}beep(880,.15);vib(120);end=Date.now()+seq[k].sec*1000;return tick()}
    if(b&&b.isConnected)b.innerHTML=`<div class="tlabel">${seq[k].label}</div><div class="timer">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div><button class="btn ghost sm" data-act="skip">Skip</button>`;
    if(left<=3&&left>0&&seq[k].lastLeft!==left){seq[k].lastLeft=left;beep(520,.06)}};
  startStep();tick();TM=setInterval(tick,200);
  TM_skip=()=>{end=Date.now()};
}
let TM_skip=null;
function stopTimer(){if(TM){clearInterval(TM);TM=null}}
function finishSet(){
  const it=PL.items[PL.i];PL.done[PL.i]=Math.min(it.sets,PL.done[PL.i]+1);
  document.querySelectorAll('.sets button').forEach((b,k)=>b.classList.toggle('on',k<PL.done[PL.i]));
  if(PL.done[PL.i]<it.sets&&it.rest)runSeq([{label:'Rest',sec:it.rest}],tboxIdle);else tboxIdle();
}
function renderFinish(){
  const str=PL.key==='strength';
  openOv(`<div class="ovtop"><button class="x" data-act="close">✕</button><b>${esc(PL.title)}</b></div>
   <div style="text-align:center;font-size:54px;margin:10px 0">🌿</div><h1 style="text-align:center">Session complete</h1>
   <div class="card"><b>Neck / back pain right now (0–10)</b><input type="range" min="0" max="10" value="2" id="painR" oninput="painV.textContent=this.value"><div class="row" style="justify-content:space-between"><span class="small muted">0 none</span><b id="painV" style="font-size:20px">2</b><span class="small muted">10 worst</span></div></div>
   ${str?`<div class="card"><b>How hard was it overall? (1–10)</b><input type="range" min="1" max="10" value="6" id="rpeR" oninput="rpeV.textContent=this.value"><div class="row" style="justify-content:space-between"><span class="small muted">easy</span><b id="rpeV" style="font-size:20px">6</b><span class="small muted">max</span></div><div class="small muted">Aim for 6–7 in Phase 1, 7–8 later.</div></div>`:''}
   <button class="btn wide" data-act="savesess">Save & close</button>`);
}
function saveSession(){
  const d=PL.date,dd=day(d);
  if(PL.key==='shift')dd.shift=(dd.shift||0)+1;else dd[PL.key]=true;
  const pain=+document.getElementById('painR').value;S.pain.push({d,v:pain,s:PL.key});
  const r=document.getElementById('rpeR');if(r)dd.rpe=+r.value;
  if(PL.key==='strength'){for(const [n,it] of PL.items.entries()){if(it.cool||!PL.done[n])continue;if(EX[it.ex].cat.includes('strength')&&!it.hold){(S.ex[it.ex]=S.ex[it.ex]||[]).push({d,top:!!PL.top[it.ex]})}}}
  save();const msg=pain>5?'Pain above 5 — tomorrow, switch on "flaring" mode and check the red flags in the Guide.':'';
  closeOv();PL=null;render();if(msg)toast(msg,7000);
}
function toast(m,ms){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:50;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)';document.body.appendChild(d);setTimeout(()=>d.remove(),ms||3500)}
let AC=null;
function beep(f,dur){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- Settings ---------- */
function openSettings(){
  openOv(`<div class="ovtop"><button class="x" data-act="close">✕</button><b>Settings</b></div>
  <div class="card"><label><b>Program start (Monday of week 1)</b><br><input type="date" id="stS" value="${S.start}"></label>
   <p class="small muted">Week numbers are counted from the Monday of this date.</p>
   <label><b>Wake-up time</b><br><input type="time" id="wkS" value="${S.wake}"></label>
   <p class="small muted">Your daily schedule (mobility, workout, shift resets, bedtime) is built from this.</p>
   <button class="btn" data-act="saveset">Save</button></div>
  <div class="card"><b>Your data</b><p class="small muted">Everything is stored only on this device, in this browser.</p>
   <button class="btn ghost sm" data-act="reset">Reset all progress</button></div>`);
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){e.preventDefault();TAB=tb.dataset.tab;if(!OV.hidden)closeOv();render();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=todayISO();
  switch(a){
    case 'ex':openEx(t.dataset.id);break;
    case 'close':PL=null;closeOv();break;
    case 'flare':S.flare[d]=!S.flare[d];save();render();break;
    case 'chk':{const dd=day(d);dd[t.dataset.k]=!dd[t.dataset.k];save();render();break}
    case 'start':startSession(t.dataset.s);break;
    case 'pw':PLANW=+t.dataset.w;render();break;
    case 'libf':LIBF=t.dataset.f;render();break;
    case 'next':{const cb=document.getElementById('topchk');if(cb)PL.top[PL.items[PL.i].ex]=cb.checked;PL.i++;renderPlayer();break}
    case 'prev':PL.i=Math.max(0,PL.i-1);renderPlayer();break;
    case 'set':{const k=+t.dataset.k;PL.done[PL.i]=PL.done[PL.i]===k+1?k:k+1;document.querySelectorAll('.sets button').forEach((b,j)=>b.classList.toggle('on',j<PL.done[PL.i]));stopTimer();tboxIdle();break}
    case 'repdone':finishSet();break;
    case 'hold':{const it=PL.items[PL.i];const seq=it.sides?[{label:'Side 1 — get ready',sec:3},{label:'Side 1',sec:it.hold},{label:'Switch sides',sec:5},{label:'Side 2',sec:it.hold}]:[{label:'Get ready',sec:3},{label:it.label?'Breathe':'Hold',sec:it.hold}];runSeq(seq,finishSet);break}
    case 'skip':TM_skip&&TM_skip();break;
    case 'savesess':saveSession();break;
    case 'settings':openSettings();break;
    case 'saveset':{const st=document.getElementById('stS').value,wk=document.getElementById('wkS').value;if(st)S.start=iso(mondayOf(parseISO(st)));if(wk)S.wake=wk;save();closeOv();render();break}
    case 'reset':if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Tap again to delete everything (cannot be undone)';t.style.color='var(--bad)';t.style.borderColor='var(--bad)';break}{const st=S.start,wk=S.wake;S={start:st,wake:wk,flare:{},days:{},ex:{},weights:[],pain:[]};save();closeOv();render();toast('All progress deleted.')}break;
    case 'addw':{const v=parseFloat(document.getElementById('wkg').value);if(v>15&&v<200){S.weights.push({d,kg:Math.round(v*10)/10});save();render()}break}
  }
});
render();
/* Installable app: offline cache (only when served over http/https, not as a loose file) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
