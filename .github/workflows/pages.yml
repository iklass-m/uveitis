# Publishes the Uveitis Workup tool to https://iklass-m.github.io/uveitis/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Copy only the site files, and stamp the service-worker cache with the
      # commit so phones pick up each new version on next open.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js robots.txt .nojekyll *.png _site/
          sed -i "s/uveitis-[0-9a-f]\{6,\}/uveitis-${GITHUB_SHA::10}/g" _site/sw.js
          grep -q "uveitis-${GITHUB_SHA::10}" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
